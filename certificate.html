<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Certificate - XenZ Technologies</title>
<meta name="description" content="See the XenZ Technologies certificate and the practical AI skills it represents.">
<meta name="theme-color" content="#eef5ff">
<link rel="icon" href="xzt.png" type="image/png">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg-dark:#050b1e;
  --bg-light:#0d1636;
  --accent:#4dd6ff;
  --text:#ffffff;
  --muted:#b7c0ff;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background:
    url("kids-ideas-bg.png") no-repeat right 20px top 260px / min(650px,60vw) auto,
    radial-gradient(circle at 12% 8%,rgba(77,214,255,.22),transparent 28%),
    radial-gradient(circle at 86% 18%,rgba(155,123,255,.18),transparent 30%),
    linear-gradient(145deg,#fff 0%,#f7fbff 52%,#eef5ff 100%);
  color:#102044;
  overflow-x:hidden;
}

/* Snow */
#snowCanvas{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
  display:none;
}

/* Common */
.container{
  width:90%;
  max-width:1200px;
  margin:auto;
  position:relative;
  z-index:1;
}

section{
  padding:56px 0;
}

p{
  color:var(--muted);
  line-height:1.6;
}

/* Header */
header{
  padding:18px 0;
  position:relative;
  z-index:1;
}
header .container{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

/* Logo */
.logo img{
  height:99px;
  width:auto;
  filter:brightness(0) saturate(100%) invert(14%) sepia(21%) saturate(1676%) hue-rotate(183deg) brightness(89%) contrast(93%);
}

/* Nav */
nav a{
  margin-left:22px;
  color:var(--muted);
  text-decoration:none;
}
nav a:hover{
  color:var(--accent);
}
.menu-toggle{display:none;border:1px solid rgba(86,128,194,.22);background:rgba(255,255,255,.8);color:#102044;border-radius:10px;padding:8px 12px;font-size:1.1rem;cursor:pointer}

/* Certificate Layout */
.cert-layout{
  display:grid;
  grid-template-columns: 1.6fr auto 1.6fr; /* cards smaller than certificate */
  align-items:center;
  gap:1px;
}

/* Compact Glass Cards */
.cert-side{
  background: rgba(255,255,255,0.9);
  backdrop-filter: blur(14px);
  border-radius:20px;
  padding:20px 36px;
  font-size:.95rem;
  color:#53627e;
  border:1px solid rgba(86,128,194,.14);
  box-shadow:0 18px 40px rgba(42,75,130,.12);

  display:flex;
  flex-direction:column;
  gap:10px; /* closes vertical gaps */
}

.cert-side h4{
  color:var(--accent);
  font-weight:600;
  font-size:1.05rem;
}

.cert-side p{
  margin:0;
  color:#53627e;
}

/* Certificate Image */
.certificate-img{
  max-width:75%;
  height:auto;
  box-shadow:0 30px 80px rgba(42,75,130,.18);
}

/* Footer */
footer{
  border-top:1px solid rgba(86,128,194,.16);
  padding:22px 0;
  font-size:.85rem;
  position:relative;
  z-index:1;
}
.footer-flex{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
}
.footer-links a{
  margin-left:18px;
  color:#53627e;
  text-decoration:none;
}
.footer-links a:hover{
  color:var(--accent);
}

/* Mobile */
@media(max-width:900px){
  .cert-layout{
    grid-template-columns:1fr;
    gap:32px;
  }
  .cert-side{
    text-align:center;
    padding:20px 28px;
  }
  .certificate-img{
    max-width:90%;
  }
}

@media(max-width:768px){
  header .container{
    flex-direction:column;
    gap:14px;
  }
  nav{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
  }
  nav a{
    margin:8px 12px;
  }
  .footer-flex{
    flex-direction:column;
  }
}
@media(max-width:700px){
  body{background-size:330px auto,auto,auto,auto;background-position:center 680px,left top,right top,center}
  header .container{padding:8px 14px}
  .logo img{height:62px}
  .menu-toggle{display:block}
  nav{display:none!important}
  nav.open{display:flex!important;flex-wrap:wrap;justify-content:center}
  nav a{margin:4px 8px;font-size:13px}
  section{padding:34px 0}
  .cert-side{padding:18px 20px}
  .certificate-img{max-width:100%}
  footer .footer-flex{text-align:center;gap:10px;padding:14px}
  .footer-links a{margin:0 7px}
}
</style>
</head>

<body>

<canvas id="snowCanvas"></canvas>

<header>
  <div class="container">
    <div class="logo">
      <a href="index.html">
        <img src="xzt.png" alt="Xenz Logo">
      </a>
    </div>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="main-nav">☰</button>
    <nav id="main-nav">
      <a href="index.html">Home</a>
      <a href="enroll.html">Enroll</a>
      <a href="ai-tools.html">AI Tools</a>
      <a href="content.html">Contact</a>
    </nav>
  </div>
</header>

<section>
  <div class="container">
    <div class="cert-layout">

      <!-- LEFT CARD -->
      <div class="cert-side">
        <h4>Certification Value</h4>
        <p>Confirms active participation and hands-on skill development.</p>
      </div>

      <!-- CERTIFICATE -->
      <div style="text-align:center;">
        <img src="simplecetifi.png" alt="Certificate" class="certificate-img">
      </div>

      <!-- RIGHT CARD -->
      <div class="cert-side">
        <h4>Why It Matters</h4>
        <p>Boosts resumes with trusted proof of real-world experience.</p>
      </div>

    </div>
  </div>
</section>

<footer>
  <div class="container footer-flex">
    <div>© 2026 XenZ Technologies</div>
    <div class="footer-links">
      <a href="index.html">Home</a>
      <a href="enroll.html">Enroll</a>
      <a href="ai-tools.html">AI Tools</a>
      <a href="content.html">Contact</a>
    </div>
  </div>
</footer>

<script>
const canvas = document.getElementById("snowCanvas");
const ctx = canvas.getContext("2d");

let w,h;
function resize(){
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

const flakes=[];
for(let i=0;i<180;i++){
  flakes.push({
    x:Math.random()*w,
    y:Math.random()*h,
    r:Math.random()*3+2,
    s:Math.random()*2+1
  });
}

function animate(){
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle="rgba(255,255,255,.8)";
  flakes.forEach(f=>{
    f.y+=f.s;
    if(f.y>h){
      f.y=-10;
      f.x=Math.random()*w;
    }
    ctx.fillRect(f.x,f.y,f.r,f.r);
  });
  requestAnimationFrame(animate);
}
animate();
</script>
<script>
const menuToggle=document.querySelector('.menu-toggle');
const mainNav=document.querySelector('#main-nav');
if(menuToggle&&mainNav){menuToggle.addEventListener('click',()=>{const open=mainNav.classList.toggle('open');menuToggle.setAttribute('aria-expanded',String(open));});}
</script>

</body>
</html>
